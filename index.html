<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>LUXE STORE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <h1>LUXE STORE</h1>
  <p>Luxury is an attitude</p>
</header>

<section class="container">

  <div class="produk">
    <img src="img/kaos.jpg" alt="Kaos Signature">
    <h2>Kaos Signature</h2>
    <p class="harga">Rp150.000</p>
    <button onclick="pesan('Kaos Signature')">Order</button>
  </div>

  <div class="produk">
    <img src="img/hoodie.jpg" alt="Hoodie Exclusive">
    <h2>Hoodie Exclusive</h2>
    <p class="harga">Rp320.000</p>
    <button onclick="pesan('Hoodie Exclusive')">Order</button>
  </div>

  <div class="produk">
    <img src="img/jacket.jpg" alt="Jacket Limited">
    <h2>Jacket Limited</h2>
    <p class="harga">Rp540.000</p>
    <button onclick="pesan('Jacket Limited')">Order</button>
  </div>

</section>

<footer>
  <p>© 2026 LUXE STORE</p>
</footer>

<script src="script.js"></script>
</body>
</html>
